name: Update Great Rann of Kutch SAR Layer

on:
  schedule:
    # Run weekly every Monday at 04:00 UTC (before Asian business hours)
    - cron: '0 4 * * 1'
  workflow_dispatch: # Enable manual run via GitHub Actions UI

permissions:
  contents: write

jobs:
  update-sar-layer:
    name: Fetch, Calibrate & Export SAR Layers
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'pipeline/requirements.txt'

      - name: Install Geospatial & SAR Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Execute SAR Processing Pipeline
        env:
          EARTHDATA_USER: ${{ secrets.EARTHDATA_USER }}
          EARTHDATA_PASS: ${{ secrets.EARTHDATA_PASS }}
        run: |
          python pipeline/fetch_and_process.py

      - name: Commit and Push Updated Layers
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Stage web raster layers and telemetry data
          git add public/assets/layers/ public/assets/data/
          
          # Check for changes and commit
          if git diff --staged --quiet; then
            echo "No changes detected in SAR rasters or heartbeats."
          else
            git commit -m "chore(sar): automated update of Kutch SAR backscatter & heartbeats [skip ci]"
            git push
          fi

