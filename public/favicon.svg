<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Deep Space Backdrop -->
  <rect width="64" height="64" rx="16" fill="#030712"/>
  
  <!-- Subtle Galaxy Nebula Glow -->
  <radialGradient id="nebula" cx="45%" cy="32%" r="55%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
    <stop offset="55%" stop-color="#1e1b4b" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
  </radialGradient>
  <rect width="64" height="64" rx="16" fill="url(#nebula)"/>
  
  <!-- Distant Stars -->
  <circle cx="15" cy="16" r="0.75" fill="#bae6fd" opacity="0.8"/>
  <circle cx="48" cy="13" r="0.65" fill="#ffffff" opacity="0.9"/>
  <circle cx="53" cy="26" r="0.8" fill="#bae6fd" opacity="0.7"/>
  <circle cx="11" cy="32" r="0.55" fill="#ffffff" opacity="0.6"/>
  <circle cx="32" cy="10" r="0.7" fill="#7dd3fc" opacity="0.85"/>

  <!-- Earth Atmospheric Outer Glow -->
  <circle cx="32" cy="62" r="32" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.65"/>
  
  <!-- Earth Globe Body -->
  <linearGradient id="earthGrad" x1="15%" y1="0%" x2="85%" y2="100%">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="35%" stop-color="#0284c7"/>
    <stop offset="70%" stop-color="#075985"/>
    <stop offset="100%" stop-color="#082f49"/>
  </linearGradient>
  <circle cx="32" cy="62" r="30" fill="url(#earthGrad)"/>
  
  <!-- Atmosphere Razor-thin Horizon Arc -->
  <path d="M 4 54 A 30 30 0 0 1 60 54" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.95"/>
  
  <!-- Luminous Beacon Glint on the Horizon -->
  <g transform="translate(43, 34)">
    <circle cx="0" cy="0" r="1.8" fill="#ffffff"/>
    <circle cx="0" cy="0" r="4.5" fill="#38bdf8" opacity="0.45"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round"/>
  </g>
  
  <!-- Elegant "S" Celestial Serif Monogram -->
  <text x="21" y="32" font-family="'Cinzel', 'Georgia', serif" font-size="20" font-weight="600" fill="#f0f9ff" letter-spacing="0.5">S</text>
</svg>

